name: marketplace-verify

on:
  workflow_dispatch:

jobs:
  request-verify:
    name: request-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Request marketplace verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: bash .github/scripts/request-marketplace-verify.sh
